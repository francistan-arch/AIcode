<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2C2P Secure Payment Gateway</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .checkout-wrapper {
      max-width: 800px;
      margin: 3rem auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .2c2p-header {
      background: #ed1c24;
      color: #ffffff;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .2c2p-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .security-badge {
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .checkout-body {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
    }
    .order-sidebar {
      background: #f8fafc;
      padding: 2rem;
      border-right: 1px solid #e2e8f0;
    }
    .payment-area {
      padding: 2rem;
    }
    .channel-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-btn {
      padding: 10px 14px;
      background: transparent;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      color: #64748b;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #ed1c24;
      border-color: #ed1c24;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #0f172a;
    }
    .btn-pay-success {
      background: #10b981;
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn-pay-success:hover { background: #059669; }
    .btn-pay-fail {
      background: #ef4444;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-pay-cancel {
      background: #64748b;
      color: #fff;
      border: none;
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="checkout-wrapper">
    <!-- Header -->
    <div class="2c2p-header">
      <div class="2c2p-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>2C2P Secure Hosted Payment Gateway</span>
      </div>
      <span class="security-badge">🔒 256-Bit SSL Encrypted</span>
    </div>

    <!-- Body -->
    <div class="checkout-body">
      <!-- Sidebar Order Summary -->
      <div class="order-sidebar">
        <h4 style="margin-bottom: 1rem; color: #0f172a;">Order Summary</h4>
        <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Merchant</div>
        <div style="font-weight: 700; color: #0f172a; margin-bottom: 1rem;" id="merchantName">Nexus Gear Store (JT01)</div>

        <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Invoice Number</div>
        <div style="font-weight: 600; color: #0f172a; margin-bottom: 1rem; word-break: break-all;" id="invoiceNo">Loading...</div>

        <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">Description</div>
        <div style="font-size: 0.9rem; color: #334155; margin-bottom: 1.5rem;" id="orderDesc">Loading...</div>

        <div style="border-top: 1px solid #e2e8f0; padding-top: 1rem;">
          <div style="font-size: 0.85rem; color: #64748b;">Total Amount</div>
          <div style="font-size: 1.5rem; font-weight: 800; color: #ed1c24;" id="orderAmount">THB 0.00</div>
        </div>
      </div>

      <!-- Payment Channel Area -->
      <div class="payment-area">
        <div class="channel-tabs">
          <button class="tab-btn active" onclick="switchChannel('card')">💳 Credit/Debit Card</button>
          <button class="tab-btn" onclick="switchChannel('qr')">📲 PromptPay / QR</button>
          <button class="tab-btn" onclick="switchChannel('wallet')">👛 E-Wallet</button>
        </div>

        <!-- Credit Card Form -->
        <div id="channel-card">
          <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text" id="cardName" value="ALEX TESTER">
          </div>
          <div class="form-group">
            <label>Card Number</label>
            <input type="text" id="cardNumber" value="4111 2222 3333 4444">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>Expiry (MM/YY)</label>
              <input type="text" id="cardExpiry" value="12/28">
            </div>
            <div class="form-group">
              <label>CVV / CVV2</label>
              <input type="text" id="cardCvv" value="123">
            </div>
          </div>
        </div>

        <!-- QR Form -->
        <div id="channel-qr" style="display: none; text-align: center; padding: 1rem 0;">
          <div style="background: #ffffff; padding: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; display: inline-block;">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=2C2P_TEST_PROMPTPAY_QR" alt="PromptPay QR Code">
          </div>
          <p style="font-size: 0.85rem; color: #64748b; margin-top: 10px;">Scan QR with any Thai Mobile Banking App (KBANK, SCB, Bangkok Bank)</p>
        </div>

        <!-- Wallet Form -->
        <div id="channel-wallet" style="display: none;">
          <div class="form-group">
            <label>Select E-Wallet Provider</label>
            <select id="walletProvider">
              <option value="TRUEMONEY">TrueMoney Wallet</option>
              <option value="SHOPEEPAY">ShopeePay</option>
              <option value="LINEPAY">Rabbit LINE Pay</option>
            </select>
          </div>
          <div class="form-group">
            <label>Mobile Phone Number</label>
            <input type="text" value="081-234-5678">
          </div>
        </div>

        <!-- Simulator Controls -->
        <div style="margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
          <div style="font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px;">
            🧪 2C2P Simulator Actions
          </div>
          <button class="btn-pay-success" onclick="submitSimulatorPayment('SUCCESS')">
            ✅ Pay & Complete Order (0000)
          </button>
          <button class="btn-pay-fail" onclick="submitSimulatorPayment('FAILED')">
            ❌ Simulate Failed Payment (2000)
          </button>
          <button class="btn-pay-cancel" onclick="submitSimulatorPayment('CANCELLED')">
            🚫 Simulate Cancel (2001)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const paymentToken = urlParams.get('paymentToken');
    const invoiceNo = urlParams.get('invoiceNo');

    let currentChannel = 'CREDIT_CARD';

    document.addEventListener('DOMContentLoaded', () => {
      fetchPaymentInfo();
    });

    async function fetchPaymentInfo() {
      try {
        const res = await fetch(`/api/simulator/payment-info?paymentToken=${encodeURIComponent(paymentToken || '')}&invoiceNo=${encodeURIComponent(invoiceNo || '')}`);
        const data = await res.json();

        if (res.ok) {
          document.getElementById('merchantName').innerText = `${data.merchantID} - Nexus Gear Store`;
          document.getElementById('invoiceNo').innerText = data.invoiceNo;
          document.getElementById('orderDesc').innerText = data.description;
          document.getElementById('orderAmount').innerText = `${data.currencyCode} ${data.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
        }
      } catch (e) {
        console.error('Fetch payment info error:', e);
      }
    }

    function switchChannel(channel) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');

      document.getElementById('channel-card').style.display = channel === 'card' ? 'block' : 'none';
      document.getElementById('channel-qr').style.display = channel === 'qr' ? 'block' : 'none';
      document.getElementById('channel-wallet').style.display = channel === 'wallet' ? 'block' : 'none';

      currentChannel = channel === 'card' ? 'CREDIT_CARD' : (channel === 'qr' ? 'PROMPTPAY' : 'E_WALLET');
    }

    async function submitSimulatorPayment(outcome) {
      try {
        const res = await fetch('/api/simulator/submit-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentToken,
            invoiceNo,
            outcome,
            paymentMethod: currentChannel
          })
        });

        const data = await res.json();
        if (data.returnUrl) {
          window.location.href = data.returnUrl;
        }
      } catch (err) {
        alert('Simulator Payment submission error: ' + err.message);
      }
    }
  </script>
</body>
</html>
